name: Scrapers

# Preço da Hora up to three times an hour (at most 30 searches, 20 s apart: about ten minutes; one run at a
# time), so a round over the whole city finishes inside the site's 72-hour window, and every run also does any
# other adapter that is due (OpenStreetMap and Overture weekly, the venue classifier daily). GitHub drops many
# scheduled runs under load (two of thirteen hourly ones ran on 10-11 Oct 2026, none for seven hours on 11 Oct),
# so each run also starts the next one NEXT_RUN_WAIT seconds after it ends (a dispatch, which GITHUB_TOKEN may
# trigger); the schedule only restarts that chain. One run at a time (the concurrency group): a run waiting its
# turn replaces any older waiting one.
# Public repository: GitHub Actions minutes are free.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      adapters:
        description: "Adapters to run now, space-separated (empty: the schedule's choice)"
        default: ""

concurrency:
  group: scrapers
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/scrapers
    env:
      CB_API_URL: ${{ vars.CB_API_URL }}
      CB_INGEST_TOKEN: ${{ secrets.CB_INGEST_TOKEN }}
      CB_STORES: ${{ vars.CB_STORES || '1' }}
      CB_FOCUS: ${{ vars.CB_FOCUS }}
      CB_META_TOKEN: ${{ secrets.CB_META_TOKEN }}
      CB_IG_USER_ID: ${{ vars.CB_IG_USER_ID }}
      CB_GEMINI_KEY: ${{ secrets.CB_GEMINI_KEY }}
      # The venue classifier's second vote (Workers AI) and its extra evidence (Google Places: only place ids kept).
      CB_CF_AI_TOKEN: ${{ secrets.CB_CF_AI_TOKEN }}
      CB_CF_ACCOUNT_ID: ${{ vars.CB_CF_ACCOUNT_ID }}
      CB_GOOGLE_PLACES_KEY: ${{ secrets.CB_GOOGLE_PLACES_KEY }}
      ADAPTERS: ${{ inputs.adapters }}
      CB_CACHE_DIR: ${{ github.workspace }}/.scrapers-cache
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: apps/scrapers
          enable-cache: true
      - run: uv sync --locked --no-dev
      - uses: actions/cache/restore@v4
        with:
          path: .scrapers-cache
          key: scrapers-cache-${{ github.run_id }}
          restore-keys: scrapers-cache-
      - name: Run
        run: |
          if [ -z "$CB_API_URL" ] || [ -z "$CB_INGEST_TOKEN" ]; then
            echo "::notice::Set the variable CB_API_URL and the secret CB_INGEST_TOKEN to send items."
            exit 0
          fi
          if [ -n "$ADAPTERS" ]; then
            uv run cb run $ADAPTERS
          else
            uv run cb run precodahora --due
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .scrapers-cache
          key: scrapers-cache-${{ github.run_id }}
      - name: Start the next run
        if: ${{ !cancelled() && inputs.adapters == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_RUN_WAIT: "480"
        run: |
          sleep "$NEXT_RUN_WAIT"
          gh workflow run scrapers.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
