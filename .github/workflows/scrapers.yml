name: Scrapers

# Preço da Hora at most once an hour (owner, 15 Oct 2026, #701: the pace the letter to SEFAZ-BA states): a run is at
# most 30 searches, 20 s apart (about ten minutes), and `cb run` starts one only an hour after the last one started
# and never within six hours of a refusal (403/429, a CAPTCHA, an unexpected answer, robots.txt). It keeps both times
# in the cache below (apps/scrapers/src/cb_scrapers/core/pace.py), so every run keeps that pace: scheduled or by hand.
# GitHub drops many scheduled runs under load (two of thirteen hourly ones ran on 10-11 Oct 2026, none for seven hours
# on 11 Oct), so the schedule tries three times an hour; a try that finds Preço da Hora not due only does any other
# adapter that is (OpenStreetMap and Overture weekly, the venue classifier and Instagram daily). No run starts
# another: the chain of 11-15 Oct 2026 is gone. One run at a time (the concurrency group); to stop the scrapers,
# disable the workflow (gh workflow disable scrapers.yml).
# Public repository: GitHub Actions minutes are free.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      adapters:
        description: "Adapters to run now, space-separated (empty: the schedule's choice; Preço da Hora keeps its pace)"
        default: ""

concurrency:
  group: scrapers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Set-up (about 2 min) + "Run" (at most 45) + saving the cache.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/scrapers
    env:
      CB_API_URL: ${{ vars.CB_API_URL }}
      CB_INGEST_TOKEN: ${{ secrets.CB_INGEST_TOKEN }}
      CB_STORES: ${{ vars.CB_STORES || '1' }}
      CB_FOCUS: ${{ vars.CB_FOCUS }}
      CB_META_TOKEN: ${{ secrets.CB_META_TOKEN }}
      CB_IG_USER_ID: ${{ vars.CB_IG_USER_ID }}
      CB_GEMINI_KEY: ${{ secrets.CB_GEMINI_KEY }}
      # Minutes the Instagram adapter may spend a run (empty: its default, 15).
      CB_IG_BUDGET_MIN: ${{ vars.CB_IG_BUDGET_MIN }}
      # The venue classifier's second vote (Workers AI) and its extra evidence (Google Places: only place ids kept).
      CB_CF_AI_TOKEN: ${{ secrets.CB_CF_AI_TOKEN }}
      CB_CF_ACCOUNT_ID: ${{ vars.CB_CF_ACCOUNT_ID }}
      CB_GOOGLE_PLACES_KEY: ${{ secrets.CB_GOOGLE_PLACES_KEY }}
      ADAPTERS: ${{ inputs.adapters }}
      CB_CACHE_DIR: ${{ github.workspace }}/.scrapers-cache
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: apps/scrapers
          enable-cache: true
      - run: uv sync --locked --no-dev
      - uses: actions/cache/restore@v4
        with:
          path: .scrapers-cache
          key: scrapers-cache-${{ github.run_id }}
          restore-keys: scrapers-cache-
      - name: Run
        # Under the job's limit, so the cache is always saved: the queue, and the pace (instagram_bd saves after
        # each account).
        timeout-minutes: 45
        run: |
          if [ -z "$CB_API_URL" ] || [ -z "$CB_INGEST_TOKEN" ]; then
            echo "::notice::Set the variable CB_API_URL and the secret CB_INGEST_TOKEN to send items."
            exit 0
          fi
          if [ -n "$ADAPTERS" ]; then
            uv run cb run $ADAPTERS
          else
            uv run cb run precodahora --due
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .scrapers-cache
          key: scrapers-cache-${{ github.run_id }}
