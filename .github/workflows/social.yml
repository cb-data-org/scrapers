name: Social (weekly)

# The weekly Instagram carousels of cervejabarata.com.br: renders "A cerveja mais barata em Salvador" and its
# bairros from the live public data (tools/social/social.mjs, 1080x1350 JPEG slides and a caption per post) and
# sends each post to the site, which hands it to the admins on Telegram for review. Nothing is published here:
# Instagram only gets a post when an admin taps Publish. Friday mornings, so people share it ahead of the
# weekend: 09:00, 09:40 and 10:20 in Salvador (GitHub skips scheduled runs now and then; the site ignores a
# post it already has, so the extra runs cost nothing). Run it by hand to send a fresh set for review now.
# On Fridays the first run also freezes the week's top 10 into data/sextou/salvador.json and commits it: the site's
# Sextou page (cervejabarata.com.br/salvador/sextou) reads that file, so it shows the carousel's own ranking.
on:
  schedule:
    - cron: "0 12 * * 5"
    - cron: "40 12 * * 5"
    - cron: "20 13 * * 5"
  workflow_dispatch:

concurrency:
  group: social
  cancel-in-progress: false

permissions:
  # Write: the Friday top 10 is committed to data/sextou (the only file this workflow ever changes).
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/social
    env:
      CB_API_URL: ${{ vars.CB_API_URL }}
      CB_INGEST_TOKEN: ${{ secrets.CB_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Render and send for review
        run: |
          if [ -z "$CB_API_URL" ] || [ -z "$CB_INGEST_TOKEN" ]; then
            echo "::error::Set the variable CB_API_URL and the secret CB_INGEST_TOKEN."
            exit 1
          fi
          # One batch per Friday (the reruns land on the same posts); a run by hand is a batch of its own.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            batch="week-$(TZ=America/Bahia date +%F)"
          else
            batch="manual-$GITHUB_RUN_ID"
          fi
          node social.mjs --out "$RUNNER_TEMP/social" --upload --batch "$batch" \
            --archive "$GITHUB_WORKSPACE/data/sextou/salvador.json"
      - name: Keep the Friday top 10
        working-directory: .
        run: |
          if [ -z "$(git status --porcelain -- data/sextou)" ]; then
            echo "No new Friday top 10."
            exit 0
          fi
          git config user.name "Cerveja Barata Bot"
          git config user.email "bot@cervejabarata.com.br"
          git add data/sextou
          git commit --quiet -m "Sextou: top 10 de $(TZ=America/Bahia date +%F)"
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social
          path: ${{ runner.temp }}/social
          retention-days: 7
