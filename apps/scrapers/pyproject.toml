[project]
name = "cb-scrapers"
version = "0.1.0"
description = "Cerveja Barata scrapers: polite adapters that feed the ingest API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "overturemaps>=1.0.2",
    "pillow>=11",
    "pydantic>=2.13.5",
    "pypdfium2>=4.30",
    "pyshp>=2.3",
    "shapely>=2.1",
]

[project.scripts]
cb = "cb_scrapers.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py313"
# Generated by datamodel-codegen (see [tool.datamodel-codegen]); CI checks it against openapi.json instead.
extend-exclude = ["src/cb_scrapers/models/contract.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# `uv run datamodel-codegen` regenerates the contract models; Scrapers CI fails when they drift.
[tool.datamodel-codegen]
input = "../../packages/contracts/openapi.json"
input-file-type = "openapi"
output = "src/cb_scrapers/models/contract.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.13"
use-annotated = true
field-constraints = true
use-standard-collections = true
use-union-operator = true
enum-field-as-literal = "all"
use-double-quotes = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format"]
# The public forms' email fields: the scrapers never use them, so plain strings (no email-validator dependency).
type-mappings = ["string+email=string"]
